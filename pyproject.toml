[project]
name = "case-file-intelligence"
version = "0.1.0"
description = "Demonstration RAG pour dossiers d'assurance synthétiques (Docling, FAISS, FastAPI)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.145.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.115.0",
    "groq>=0.11.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.30.0",
]
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
case-file-intelligence = "case_file_intelligence:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
